<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing accent gradients -->
    <linearGradient id="accent-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for neon glows -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .radar-pulse {
      animation: pulse 4s ease-out infinite;
      transform-origin: 1020px 210px;
    }
    .radar-sweep {
      animation: rotate-sweep 8s linear infinite;
      transform-origin: 1020px 210px;
    }
    .data-flow-line {
      stroke-dasharray: 8 12;
      animation: flow 20s linear infinite;
    }
    .floating-node-1 {
      animation: float-1 5s ease-in-out infinite alternate;
    }
    .floating-node-2 {
      animation: float-2 6s ease-in-out infinite alternate;
    }
    .alert-beacon {
      animation: beacon-blink 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { r: 20px; opacity: 0.8; }
      50% { r: 140px; opacity: 0.3; }
      100% { r: 210px; opacity: 0; }
    }
    @keyframes rotate-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes flow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes float-1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes float-2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(10px); }
    }
    @keyframes beacon-blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs (Behind Content) -->
  <circle cx="180" cy="110" r="140" fill="#06b6d4" opacity="0.08" filter="url(#neon-glow)" />
  <circle cx="1020" cy="210" r="180" fill="url(#radar-glow)" />
  <circle cx="500" cy="340" r="120" fill="#8b5cf6" opacity="0.07" filter="url(#neon-glow)" />

  <!-- Dynamic Radar Visualization on Right Side (Stays strictly on the right side) -->
  <g id="radar-system">
    <!-- Radar concentric rings -->
    <circle cx="1020" cy="210" r="60" stroke="#0ea5e9" stroke-width="1.2" fill="none" opacity="0.25" />
    <circle cx="1020" cy="210" r="110" stroke="#0ea5e9" stroke-width="1.2" fill="none" opacity="0.2" />
    <circle cx="1020" cy="210" r="160" stroke="#0ea5e9" stroke-width="1.2" fill="none" opacity="0.15" />
    <circle cx="1020" cy="210" r="200" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.1" />

    <!-- Animated Radar Pulses -->
    <circle class="radar-pulse" cx="1020" cy="210" r="30" stroke="#06b6d4" stroke-width="2" fill="none" />
    <circle class="radar-pulse" style="animation-delay: 2s;" cx="1020" cy="210" r="30" stroke="#8b5cf6" stroke-width="1.5" fill="none" />

    <!-- Radar Crosshairs -->
    <line x1="820" y1="210" x2="1220" y2="210" stroke="#0ea5e9" stroke-width="1" opacity="0.2" />
    <line x1="1020" y1="10" x2="1020" y2="410" stroke="#0ea5e9" stroke-width="1" opacity="0.2" />

    <!-- Rotating Radar Scanner Sweep -->
    <g class="radar-sweep">
      <path d="M 1020 210 L 1180 140 A 170 170 0 0 0 1020 40 Z" fill="url(#accent-cyan-blue)" opacity="0.12" />
      <line x1="1020" y1="210" x2="1180" y2="140" stroke="#22d3ee" stroke-width="2" opacity="0.7" />
    </g>

    <!-- Radar Threat / Data Blips -->
    <g class="floating-node-1">
      <circle cx="950" cy="150" r="5" fill="#ef4444" filter="url(#subtle-glow)" />
      <circle cx="950" cy="150" r="12" stroke="#ef4444" stroke-width="1" fill="none" class="alert-beacon" />
      <text x="962" y="154" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">EXFIL TRACE</text>
    </g>

    <g class="floating-node-2">
      <circle cx="1080" cy="270" r="5" fill="#10b981" filter="url(#subtle-glow)" />
      <text x="1092" y="274" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600">SAFE MODE: ON</text>
    </g>

    <g class="floating-node-1" style="animation-delay: 1.5s;">
      <circle cx="1110" cy="130" r="4.5" fill="#38bdf8" filter="url(#subtle-glow)" />
      <text x="1122" y="134" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="500">DSPM POSTURE</text>
    </g>

    <!-- Connecting data streams -->
    <path d="M 720 210 Q 860 160 950 150" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" class="data-flow-line" />
    <path d="M 720 260 Q 880 300 1080 270" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.4" class="data-flow-line" />
  </g>

  <!-- Foreground Content Area: Left & Center (Guaranteed clear & legible) -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#22c55e" class="alert-beacon" />
      <text x="30" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED THREAT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Data Detection &amp; Response
    </text>
    <text x="590" y="140" fill="url(#accent-cyan-blue)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      (DDR)
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">
      The authoritative guide to DDR &amp; DSPM platforms, behavioral analytics &amp; automated exfiltration defense.
    </text>

    <!-- Highlighted Architecture Badges/Pills in Foreground -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Real-Time Behavioral Threat Detection -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="8" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.2" />
        <text x="18" y="26" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700">⚡ Behavioral Analytics</text>
      </g>

      <!-- Pill 2: Automated Exfiltration Response -->
      <g transform="translate(225, 0)">
        <rect width="220" height="42" rx="8" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.2" />
        <text x="18" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700">🛡️ Automated Incident Response</text>
      </g>

      <!-- Pill 3: DSPM & Multi-Cloud Defense -->
      <g transform="translate(460, 0)">
        <rect width="200" height="42" rx="8" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="18" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700">☁️ DSPM &amp; Multi-Cloud</text>
      </g>
    </g>

    <!-- Stats / Scope Metrics Row -->
    <g transform="translate(0, 315)">
      <g transform="translate(0, 0)">
        <text x="0" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">Top SaaS</text>
        <text x="0" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500">Enterprise platforms analyzed</text>
      </g>
      <line x1="180" y1="6" x2="180" y2="52" stroke="#334155" stroke-width="1" />

      <g transform="translate(210, 0)">
        <text x="0" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">11+ Open-Source</text>
        <text x="0" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500">Discovery &amp; detection stacks</text>
      </g>
      <line x1="420" y1="6" x2="420" y2="52" stroke="#334155" stroke-width="1" />

      <g transform="translate(450, 0)">
        <text x="0" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">$4.5B → $9.3B</text>
        <text x="0" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500">Market size (2026–2031 CAGR 15.6%)</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
